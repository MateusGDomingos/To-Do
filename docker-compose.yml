version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: todo-api-db
    environment:
      POSTGRES_DB: tododb
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo123
    ports:
      - "5432:5432"
    volumes:
      - todo-api-data:/var/lib/postgresql/data
volumes:
  todo-api-data: